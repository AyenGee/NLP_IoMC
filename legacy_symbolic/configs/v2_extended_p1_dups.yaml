# CORRECTED-PROTOCOL ("v2") experiment. Every generation is trained for a FIXED
# budget of 150 epochs with early stopping OFF (patience: null), on pools
# WITH duplicates (with-replacement resampling, as in the original runs).
#
# Why: the first 18+ runs trained with early stopping on validation loss and
# built generation >= 1 pools by sampling WITH replacement (~63% distinct
# sequences). The follow-up experiments showed both choices manufactured much
# of the apparent collapse: retraining first failures without early stopping
# recovered 4 of 6, and removing duplicates cut failures from 22/27 to 1/27.
# Factorial control: early stopping OFF but duplicates KEPT, so with the original (early stopping ON, duplicates ON) and the no-duplicates runs it separates the two artifacts.
#
# Everything else matches extended_collapse.yaml.
# Generated by experiments/make_v2_configs.py; edit that script, not this file.
task:
  K: 64
  L: 8
  n_classes: 4
  burstiness: 3
  shuffle_context: true
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  dropout: 0.0
train:
  lr: 0.001
  weight_decay: 0.1
  batch_size: 128
  n_epochs: 150
  warmup_steps: 100
  grad_clip: 1.0
  extended: true
  aux_weight: 1.0
  eval_every: 1
  interp_every: 5
  patience: null
  seed: 0
  device: auto
  n_train: 20000
  n_val: 800
  n_test: 800
  data_seed: 0
collapse:
  n_generations: 10
  p_synthetic: 1.0
  pool_size: 20000
  variant: extended
  gen_batch_size: 256
  temperature: 1.0
  seed: 0
  with_replacement: true
run_name: v2_extended_p1_dups
