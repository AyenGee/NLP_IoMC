# Exact-task collapse condition exact_lr1e5_base_p0: base model, p = 0: confirmation at the paper's lr 1e-5 and 1,000,000 sequences (31,250 steps) per generation.
# lr 1e-05, 1,000,000 sequences per generation, 10 generations, same initialisation in every generation of a run.
# loss_weights (lq, S2, l_S2) = (1, 0.1, 0.1) for the extended variant: see src/metrics.py for why not equal.
