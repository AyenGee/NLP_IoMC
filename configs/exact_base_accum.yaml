# Exact-task collapse condition exact_base_accum: base model, accumulate: generation g trains on a fixed real pool plus the synthetic pools of generations 1..g (Gerstgrasser et al. 2024), instead of replacing.
# lr 0.0003, 160,000 sequences per generation, 10 generations, same initialisation in every generation of a run.
# loss_weights (lq, S2, l_S2) = (1, 0.1, 0.1) for the extended variant: see src/metrics.py for why not equal.
# Generated by experiments/make_configs.py. Tier 2; lr, budget and evaluation interval are those of the Tier 1 configs (lr 0.0003, 160,000 sequences = 5,000 steps per generation).
collapse:
  variant: base
  p_synthetic: 1.0
  n_generations: 10
  temperature: 1.0
  greedy: false
  sequences: 160000
  lr: 0.0003
  loss_weights:
  - 1.0
  - 0.1
  - 0.1
  eval_every: 250
  gen_batch_size: 2048
  mode: accumulate
