# Exact-task collapse condition exact_extended_weak1000: extended model, weak-generator test: generation 0 trained for only 1000 steps (phase change at about 750-1,750 steps), then 10 further generations on its samples (p = 1, the Tier 1 settings).
# lr 0.0003, 160,000 sequences per generation, 11 generations, same initialisation in every generation of a run.
# loss_weights (lq, S2, l_S2) = (1, 0.1, 0.1) for the extended variant: see src/metrics.py for why not equal.
# Generated by experiments/make_configs.py. Tier 2; lr, budget and evaluation interval are those of the Tier 1 configs (lr 0.0003, 160,000 sequences = 5,000 steps per generation).
collapse:
  variant: extended
  p_synthetic: 1.0
  n_generations: 11
  temperature: 1.0
  greedy: false
  sequences: 160000
  lr: 0.0003
  loss_weights:
  - 1.0
  - 0.1
  - 0.1
  eval_every: 250
  gen_batch_size: 2048
  gen0_steps: 1000
