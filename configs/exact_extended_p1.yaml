# Exact-task collapse condition exact_extended_p1: extended model, fully synthetic.
# lr 0.0003, 160,000 sequences per generation, 10 generations, same initialisation in every generation of a run.
# loss_weights (lq, S2, l_S2) = (1, 0.1, 0.1) for the extended variant: see src/metrics.py for why not equal.
# Generated by experiments/make_configs.py. Chosen at the tuning gate (results/exact/tuning_table.md): lr 3e-4 gives the same circuit as the paper's lr in all 3 seeds (base and extended), phase change at 750-1,000 steps, val accuracy within the 0.02 tolerance of the best; 160,000 sequences = 5,000 steps is at least 2.5x the slowest phase change and past the point where val accuracy is within 0.02 of its final value in every seed (<=2,500 steps).
collapse:
  variant: extended
  p_synthetic: 1.0
  n_generations: 10
  temperature: 1.0
  greedy: false
  sequences: 160000
  lr: 0.0003
  loss_weights:
  - 1.0
  - 0.1
  - 0.1
  eval_every: 250
  gen_batch_size: 2048
